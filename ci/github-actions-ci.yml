name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke (dados sintéticos + backtest)
        run: |
          hantecbot demo-data --out /tmp/s.csv --bars 5000
          hantecbot backtest --csv /tmp/s.csv --report /tmp/r.html

# Este arquivo é o workflow de CI pronto para uso.
# O push automatizado não tem permissão para criar .github/workflows,
# então copie manualmente:  mkdir -p .github/workflows && cp ci/github-actions-ci.yml .github/workflows/ci.yml
