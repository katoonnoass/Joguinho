# Cesta diária pré-registrada (D1) — trend following clássico em 5 mercados.
#
# REGRA DE OURO deste arquivo: os parâmetros de SINAL são PRÉ-REGISTRADOS, não
# otimizados. São os valores canônicos de seguidores de tendência (média rápida
# 50 / lenta 200, rompimento de 55 dias, stop 3 ATR, alvo 5R).
#
# `tentativas: 24` = tudo o que foi avaliado, sem esconder nada:
#   * 6 conjuntos de sinal (rápido 10/50, médio 20/100, lento 50/200 × ADX 0/20);
#   * 16 combinações de gestão da posição (parcial em 1R on/off × breakeven em
#     1R on/off × trailing 0 / 2,5 / 4,0 / 6,0 ATR);
#   * 2 cestas alternativas de mercados (11 mercados com prata/petróleo/índices
#     e 22 mercados com 17 pares de FX) — ambas PIORARAM o resultado e foram
#     descartadas; ver docs/cesta-d1.md.
# É este número que define a barra de significância (correção de Šidák).
# Mexeu em qualquer coisa? Atualize-o.

nome: cesta_d1_trend
tentativas: 24

estrategia: trend_atr
parametros:
  fast: 50
  slow: 200
  breakout: 55
  atr_period: 14
  atr_stop_mult: 3.0
  reward_r: 5.0
  adx_min: 20           # exige tendência com força mínima
  allow_short: true

# Gestão da posição — parte do manifesto, não detalhe de implementação.
# Realiza metade em 1R e leva o stop para o zero a zero; o resto corre até o
# alvo de 5R. SEM trailing: em D1 o trailing de 2,5 ATR cortava justamente as
# tendências que pagam a conta (PF 1,45 com trailing contra 1,92 sem).
gestao:
  parcial_em_r: 1.0
  breakeven_em_r: 1.0
  trailing_atr: 0.0

carteira:
  risco_por_operacao_pct: 2.0   # nominal; o governador reduz sozinho
  meta_drawdown_pct: 1.25       # meta DURA de DD da carteira (era 2,0)
  budget_fraction: 0.30         # arrisca 30% da folga até a meta
  saldo_inicial: 100000

mercados:
  - symbol: XAUUSD
    csv: data/XAUUSD_D1.csv
  - symbol: EURUSD
    csv: data/EURUSD_D1.csv
  - symbol: US500
    csv: data/US500_D1.csv
  - symbol: USDX
    csv: data/USDX_D1.csv
  - symbol: BTCUSD
    csv: data/BTCUSD_D1.csv
