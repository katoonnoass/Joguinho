# Fimathe Prop — CONTA FINANCIADA (após aprovação em Fast/Double Stage)
# Fonte: PDF oficial Mar/2026. Reconfira antes de usar.
name: fimathe_conta_financiada
fonte: https://fimatheprop.com/wp-content/uploads/2026/04/Regras-Oficiais-da-Fimathe-Prop_Mar2026-2.pdf
verificado_em: "2026-08-31"

profit_target_pct: null       # conta financiada não tem meta
min_profit_days: 3            # "mesmo que das contas de desafio"
min_profit_day_pct: 0.5

daily_loss_pct: 5.0
daily_baseline: max_balance_equity_prev_close

total_loss_pct: 10.0          # "idem às regras do desafio" — ajuste conforme o plano de origem
total_loss_mode: static

max_risk_pct: 3.0             # regra de risco máximo da conta financiada
max_inactivity_days: 30
consistency_pct: null
buffer_pct: null
min_trade_seconds: 30
max_short_trades_per_session: 10
weekend_hold_allowed: true
news_blackout_minutes: 0
ea_allowed: true
leverage: {fx: 50, ouro: 5, prata: 5, indices: 5, petroleo: 5, cripto: 2}
observacoes: >
  "Perda Total Máxima: idem às regras do desafio" — se você veio do Fast, troque
  para total_loss_pct 6 / mode trailing. Após o primeiro saque o piso trava no
  saldo inicial.
