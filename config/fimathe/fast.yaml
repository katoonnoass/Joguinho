# Fimathe Prop — programa FAST
# ATENÇÃO: valores transcritos do PDF "Regras Oficiais da Fimathe Prop –
# Programas Fast, Double Stage e Instant Lite" (versão Mar/2026).
# Reconfira antes de cada homologação: mesa muda regra sem aviso.
name: fimathe_fast
fonte: https://fimatheprop.com/wp-content/uploads/2026/04/Regras-Oficiais-da-Fimathe-Prop_Mar2026-2.pdf
verificado_em: "2026-08-31"

profit_target_pct: 10.0
min_profit_days: 0
min_profit_day_pct: 0.0

daily_loss_pct: 5.0
daily_baseline: max_balance_equity_prev_close   # maior entre saldo e equity no fechamento

total_loss_pct: 6.0
total_loss_mode: trailing                       # 6% trailing sobre o SALDO INICIAL
trailing_locks_at_initial: true                 # trava quando o lucro fechado >= 6%

max_risk_pct: null                              # Fast não tem regra de risco máximo
max_inactivity_days: 30
consistency_pct: null
buffer_pct: null
min_trade_seconds: 30
max_short_trades_per_session: 10
weekend_hold_allowed: true
news_blackout_minutes: 0                        # "permitido com cautela"; algumas contas: 3 min
ea_allowed: true
leverage: {fx: 50, ouro: 5, prata: 5, indices: 5, petroleo: 5, cripto: 2}
observacoes: >
  Perda total é TRAILING de 6% do saldo inicial (não 10% estático). Após o
  primeiro saque o piso trava no saldo inicial. Scalping em massa (<30s) é
  violação subjetiva. Plataforma MT5.
