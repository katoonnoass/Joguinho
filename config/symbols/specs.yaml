# Especificações por instrumento (confira no seu terminal MT5: clique direito no
# símbolo -> Especificação). Números errados aqui = backtest mentiroso.
# Valores conservadores/pessimistas de propósito.

# `risk_overrides` ajusta os filtros do RiskManager ao instrumento: o que é
# spread alargado no EURUSD é spread normal no ouro.
EURUSD:
  risk_overrides:
    max_spread_points: 25
    min_stop_points: 50
  symbol: EURUSD
  digits: 5
  point: 0.00001
  contract_size: 100000
  volume_min: 0.01
  volume_max: 50.0
  volume_step: 0.01
  spread_points: 8          # 0,8 pip
  commission_per_lot: 3.5
  swap_long_per_lot: -3.0
  swap_short_per_lot: 0.5

USDCHF:
  risk_overrides:
    max_spread_points: 35
    min_stop_points: 60
  symbol: USDCHF
  digits: 5
  point: 0.00001
  contract_size: 100000
  volume_min: 0.01
  volume_max: 50.0
  volume_step: 0.01
  spread_points: 15
  commission_per_lot: 3.5
  swap_long_per_lot: 1.0
  swap_short_per_lot: -5.0

XAUUSD:
  risk_overrides:
    max_spread_points: 60      # ouro tem spread naturalmente maior
    min_stop_points: 150       # US$ 1,50
  symbol: XAUUSD
  digits: 2
  point: 0.01
  contract_size: 100         # 1 lote = 100 onças
  volume_min: 0.01
  volume_max: 20.0
  volume_step: 0.01
  spread_points: 30          # US$ 0,30 por onça
  commission_per_lot: 5.0
  swap_long_per_lot: -12.0
  swap_short_per_lot: 4.0

# ---------------------------------------------------------------------------
# Cestas diária (D1) — CFDs de índice, dólar e cripto. Números conservadores no
# estilo Hantec; confirme no seu terminal antes de operar.
US500:
  risk_overrides:
    max_spread_points: 25
    min_stop_points: 100        # 10 pontos de índice
  symbol: US500
  digits: 1
  point: 0.1
  contract_size: 1              # 1 lote = US$ 1 por ponto de índice
  volume_min: 0.1
  volume_max: 100.0
  volume_step: 0.1
  spread_points: 6              # 0,6 ponto de índice
  commission_per_lot: 0.0
  swap_long_per_lot: -0.6
  swap_short_per_lot: -0.2

USDX:
  risk_overrides:
    max_spread_points: 60
    min_stop_points: 200
  symbol: USDX
  digits: 3
  point: 0.001
  contract_size: 1000
  volume_min: 0.1
  volume_max: 50.0
  volume_step: 0.1
  spread_points: 30
  commission_per_lot: 0.0
  swap_long_per_lot: -1.0
  swap_short_per_lot: -1.0

BTCUSD:
  risk_overrides:
    max_spread_points: 8000
    min_stop_points: 50000      # US$ 500
    weekdays: [0, 1, 2, 3, 4, 5, 6]
  symbol: BTCUSD
  digits: 2
  point: 0.01
  contract_size: 1              # 1 lote = 1 BTC
  volume_min: 0.01
  volume_max: 10.0
  volume_step: 0.01
  spread_points: 4000           # US$ 40
  commission_per_lot: 0.0
  swap_long_per_lot: -30.0
  swap_short_per_lot: -30.0
