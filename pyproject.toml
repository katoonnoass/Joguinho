[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hantecbot"
version = "0.1.0"
description = "Robô de trading algorítmico para contas Hantec (MetaTrader 5), com backtest, walk-forward e gestão de risco."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
live = ["MetaTrader5>=5.0.45; platform_system=='Windows'"]
dev = ["pytest>=7.0"]

[project.scripts]
hantecbot = "hantecbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
